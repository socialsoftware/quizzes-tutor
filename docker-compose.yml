services:
  postgres:
    image: postgres:alpine
    container_name: postgres
    command: postgres -c 'max_connections=50'
    ports:
      - 5433:5432
    restart: unless-stopped
    volumes:
      - ./data/dumps:/dumps
    env_file:
      - ./data/env/database.dev.env
      
  fraud-service:
    build:
      context: ./fraud-service/
      platforms:
        - linux/amd64
    image: fraud-service:latest
    container_name: fraud-service
    depends_on:
      - postgres
    links:
      - postgres
    ports:
      - 5000:5000
    restart: unless-stopped
    env_file:
      - ./data/env/fraud-service.dev.env

  aqg-service:
    build:
      context: ./aqg-service/
    image: aqg-service:latest
    container_name: aqg-service
    depends_on:
      postgres:
        condition: service_started
      # Only with --profile local-llm: wait until the model is downloaded
      ollama-pull:
        condition: service_completed_successfully
        required: false
    links:
      - postgres
    # Not published: only the backend reaches it, on the compose network
    expose:
      - 8000
    restart: unless-stopped
    volumes:
      - aqg-materials:/data/materials
    env_file:
      - ./data/env/aqg-service.dev.env

  # Local LLM for the aqg-service (LLM_PROVIDER=ollama): docker compose --profile local-llm up
  # CPU by default; add docker-compose.gpu.yml to run it on an NVIDIA GPU
  ollama:
    image: ollama/ollama
    container_name: ollama
    profiles: ["local-llm"]
    expose:
      - 11434
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # The generation prompts carry several material excerpts; Ollama's default window cuts them
      - OLLAMA_CONTEXT_LENGTH=8192
      # Keep the model loaded between the calls of a job instead of reloading it each time
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Downloads LLM_MODEL from aqg-service.dev.env into the ollama volume, then exits
  ollama-pull:
    image: ollama/ollama
    container_name: ollama-pull
    profiles: ["local-llm"]
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ./data/env/aqg-service.dev.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # Empty LLM_MODEL means the aqg-service default for Ollama (app/config.py)
    command: ['ollama pull "$${LLM_MODEL:-llama3.1:8b}"']
    restart: "no"

  backend:
    build:
      context: ./backend/
      args:
        PROFILE: dev
      platforms:
        - linux/arm64
    image: tutor-backend
    container_name: backend
    depends_on:
      - postgres
#      - fraud-service
    links:
      - postgres
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - ./data/images:/images
      - ./data/load:/load
      - ./data/export:/export
    env_file:
      - ./data/env/backend.dev.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tutordb

  frontend:
    build:
      context:  ./frontend/
      dockerfile: Dockerfile
      args:
        NODE_ENV: dev
      platforms:
        - linux/arm64
    image: tutor-frontend
    container_name: frontend
    depends_on:
      - backend
    links:
      - backend
    ports:
      - 8081:80
    restart: unless-stopped
    volumes:
      - ./data/localhost-nginx.conf:/etc/nginx/nginx.conf
      - ./data/error.log:/var/log/nginx/error.log
      - ./data/access.log:/var/log/nginx/access.log

  be-unit-tests:
    image: maven:3.9.11-eclipse-temurin-25
    stop_signal: SIGKILL
    stdin_open: true
    tty: true
    working_dir: $PWD/backend/
    volumes:
      - $PWD:$PWD
      - ~/.m2:/root/.m2
    command: mvn -Ptest test

  integration-tests:
    image: maven:3.9.11-eclipse-temurin-25
    stop_signal: SIGKILL
    stdin_open: true
    tty: true
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tutordb
      - PSQL_INT_TEST_DB_USERNAME=engineer
      - PSQL_INT_TEST_DB_PASSWORD=password
    working_dir: $PWD/backend/
    volumes:
      - $PWD:$PWD
      - ~/.m2:/root/.m2
    command: mvn -Ptest-int integration-test

  fe-unit-tests:
    image: node:24-alpine
    stop_signal: SIGKILL
    stdin_open: true
    tty: true
    working_dir: $PWD/frontend/
    volumes:
      - $PWD:$PWD
    command: /bin/sh -c "npm install && npm run test:unit"

volumes:
  aqg-materials:
  ollama-models:
